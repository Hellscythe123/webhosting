        <!-- Zero-Flicker Preload Script for Theme (Default System) -->
        <script>
            (function() {
                try {
                    const storedTheme = localStorage.getItem('theme');
                    const activeTheme = storedTheme === 'dark' ? 'dark' : 'light'; // light is the default, no auto/OS follow
                    document.documentElement.setAttribute('data-bs-theme', activeTheme);
                    document.documentElement.classList.remove('light-style', 'dark-style');
                    document.documentElement.classList.add(activeTheme === 'dark' ? 'dark-style' : 'light-style');
                } catch (e) {
                    console.error('Theme preload error:', e);
                }
            })();
        </script>

        <style>
            /* 1. Default Focus State */
            .input-group-merge:has(.form-control:focus) {

                border-radius: 0.5rem;
            }
            .input-group-merge:has(.form-control:focus) .input-group-text,

            /* 2. Invalid State (Red) - Must override default focus */
            .input-group-merge:has(.form-control.is-invalid) {
                box-shadow: 0 0 0 3px rgba(255, 62, 29, 0.22) !important;
                border-radius: 0.5rem;
            }

    <!-- Theme Switcher Engine (Dark / Light Mode, Default System) -->
    <script>
        function getStoredTheme() {
            return localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            html.setAttribute('data-bs-theme', theme);
            
            const icon = document.getElementById('themeToggleIcon');
            const label = document.getElementById('themeToggleLabel');
            const btn = document.getElementById('themeToggleBtn');
            
            if (theme === 'dark') {
                html.classList.remove('light-style');
                html.classList.add('dark-style');
                if (icon) icon.className = 'fa-solid fa-sun text-warning';
                if (label) label.textContent = 'โหมดมืด';
                if (btn) btn.setAttribute('title', 'สลับเป็นโหมดสว่าง (Light Mode)');
            } else {
                html.classList.remove('dark-style');
                html.classList.add('light-style');
                if (icon) icon.className = 'fa-solid fa-moon text-secondary';
                if (label) label.textContent = 'โหมดสว่าง';
                if (btn) btn.setAttribute('title', 'สลับเป็นโหมดมืด (Dark Mode)');
            }
            
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(getStoredTheme());
        });
    </script>
